stages:
  - lint
  - test

lint:
  stage: lint
  image: ghcr.io/typo3/core-testing-php84:latest
  script:
    - composer validate
    - find *.php Classes Configuration -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l
    - bash -n tests/run.sh

# Installs the extension into a fresh TYPO3 project and runs the migrations commands, see
# tests/run.sh. One job per TYPO3 version and database.
integration:
  stage: test
  image: ghcr.io/typo3/core-testing-php84:latest
  parallel:
    matrix:
      - TYPO3: ["12", "13", "14"]
        DB_IMAGE: ["mariadb:10.11", "mysql:8.0"]
  services:
    - name: $DB_IMAGE
      alias: db
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: typo3
    DB_HOST: db
    DB_USER: root
    DB_PASSWORD: root
    DB_NAME: typo3
  script:
    - bash tests/run.sh "$TYPO3"
